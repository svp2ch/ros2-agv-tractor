### Параметры navsat_transform_node
#
# Этот узел из robot_localization преобразует GPS координаты (широта/долгота)
# в декартовы координаты системы map и публикует их как nav_msgs/Odometry.
# Выход /odometry/gps затем поступает в ekf_global для коррекции карты.

navsat_transform:
  ros__parameters:

    # Частота работы узла (Гц) — нет смысла чаще частоты GPS (5 Гц)
    frequency: 10.0

    # Задержка между GPS и данными IMU/odometry для синхронизации (с)
    delay: 3.0

    # Магнитное склонение для региона (радианы).
    # 0.0 — для симуляции (Gazebo не имеет магнитного поля).
    magnetic_declination_radians: 0.0

    # Смещение курса IMU относительно севера (радианы).
    # 3.14159 (π): эмпирически /odometry/gps выходил точным −(/odom) —
    # навигационный фрейм GPS был развёрнут на 180° относительно фрейма
    # одометрии, и GPS клал позицию в противоположный угол поля. Поворот
    # курса на π совмещает GPS-привязку с реальным движением трактора.
    yaw_offset: 3.14159265

    # Если true: нулевая точка GPS = первое полученное GPS-измерение.
    zero_altitude: true

    # Публиковать TF world->odom на основе GPS-коррекции
    publish_filtered_gps: false

    # Использовать одометрию для помощи в вычислении начального курса.
    # true: начальный курс берём из одометрии (надёжно в симуляции без магнитометра).
    use_odometry_yaw: true

    # Ждать заданный датум перед стартом трансформации.
    # true + явный datum: точка отсчёта map ЖЁСТКО привязана к географическим
    # координатам начала мира Gazebo (Краснодар, см. spherical_coordinates в .world).
    # Это убирает «прыгающий датум»: navsat больше не переустанавливает нулевую
    # точку по каждому шумному GPS-измерению.
    wait_for_datum: true

    # Датум [широта, долгота, курс(рад)] — совпадает с origin мира Gazebo.
    datum: [45.040000, 38.980000, 0.0]

    # Подписки (имена топиков)
    # imu_topic: /imu/data  (задаётся через remapping в launch)
    # gps_topic: /gps/fix   (задаётся через remapping в launch)
